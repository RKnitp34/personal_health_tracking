{% extends "base.html" %}
{% block title %}Edit weight{% endblock %}
{% block content %}
  <h1>Edit weight entry</h1>
  <form method="post">
    <label>Date</label>
    <input type="date" name="date" value="{{ metric.date }}" required>
    <label>Weight (kg)</label>
    <input type="number" step="0.1" name="weight_kg" value="{{ metric.weight_kg }}" required>
    <label>Body fat % (optional)</label>
    <input type="number" step="0.1" name="body_fat_pct" value="{{ metric.body_fat_pct if metric.body_fat_pct is not none else '' }}">
    <button type="submit">Save</button>
  </form>
  <form method="post" action="{{ url_for('delete_entry', entry_type='body', entry_id=metric.id) }}"
        onsubmit="return confirm('Delete this entry?')">
    <button type="submit" class="danger">Delete</button>
  </form>
  <form method="get" action="{{ url_for('index') }}">
    <button type="submit" class="secondary">Back</button>
  </form>
{% endblock %}
