{% extends "base.html" %}
{% block title %}Edit food{% endblock %}
{% block content %}
  <h1>Edit food entry</h1>
  <form method="post">
    <label>Date</label>
    <input type="date" name="date" value="{{ food.date }}" required>
    <label>Description</label>
    <textarea name="description" rows="2" required>{{ food.description }}</textarea>
    <div class="row">
      <div>
        <label>Calories</label>
        <input type="number" step="1" name="calories" value="{{ food.calories if food.calories is not none else '' }}">
      </div>
      <div>
        <label>Protein (g)</label>
        <input type="number" step="1" name="protein_g" value="{{ food.protein_g if food.protein_g is not none else '' }}">
      </div>
    </div>
    <button type="submit">Save</button>
  </form>
  <form method="post" action="{{ url_for('delete_entry', entry_type='food', entry_id=food.id) }}"
        onsubmit="return confirm('Delete this entry?')">
    <button type="submit" class="danger">Delete</button>
  </form>
  <form method="get" action="{{ url_for('index') }}">
    <button type="submit" class="secondary">Back</button>
  </form>
{% endblock %}
