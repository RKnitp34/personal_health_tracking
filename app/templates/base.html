<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>{% block title %}Health Tracker{% endblock %}</title>
  <link rel="manifest" href="{{ url_for('manifest') }}">
  <link rel="icon" href="{{ url_for('static', filename='icon.svg') }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.svg') }}">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Health Tracker">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fa;
      --surface: #ffffff;
      --text: #1f2430;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #2563eb;
      --accent-soft: #eff4ff;
      --radius: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a;
        --surface: #1e2128;
        --text: #eef0f3;
        --muted: #9aa1ac;
        --border: #2c303a;
        --accent: #5b8cff;
        --accent-soft: #1c2436;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
      line-height: 1.45;
      background: var(--bg);
      color: var(--text);
    }
    body.wide { max-width: 480px; }
    @media (min-width: 760px) {
      body.wide { max-width: 920px; }
    }
    h1 { font-size: 1.4rem; margin: 4px 0 14px; }
    h2 { font-size: 0.95rem; margin: 0 0 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    input, textarea, select, button {
      font-size: 16px;
      width: 100%;
      padding: 12px;
      margin: 6px 0;
      box-sizing: border-box;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
    }
    button {
      background: var(--accent);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: var(--muted); }
    button.danger { background: #dc2626; }
    .flash { padding: 10px 12px; border-radius: 10px; margin: 10px 0; }
    .flash.error { background: #fee2e2; color: #991b1b; }
    .flash.success { background: #dcfce7; color: #166534; }
    .flash.warning { background: #fef9c3; color: #854d0e; }
    ul.entries { list-style: none; padding: 0; margin: 0; }
    ul.entries li {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    ul.entries li:last-child { border-bottom: none; }
    .entry-main { flex: 1; }
    .entry-type { font-size: 0.72rem; text-transform: uppercase; color: var(--muted); letter-spacing: 0.03em; }
    .entry-date { font-size: 0.8rem; color: var(--muted); }
    a.edit-link {
      font-size: 0.85rem; color: var(--accent); text-decoration: none; white-space: nowrap;
      padding: 8px 6px; margin: -8px -6px; /* enlarge tap target without shifting layout */
    }
    .chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 18px; }
    .chip {
      width: auto; flex: 0 0 auto; margin: 0;
      padding: 8px 14px; font-size: 0.85rem; font-weight: 600;
      background: var(--accent-soft); color: var(--accent); border: 1px solid var(--border);
    }
    .hint { font-size: 0.85rem; color: var(--muted); margin: 4px 0 16px; }
    form.inline { display: inline; }
    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }

    /* Dashboard card layout */
    .grid { display: grid; grid-template-columns: 1fr; gap: 14px; }
    @media (min-width: 760px) {
      .grid { grid-template-columns: 1fr 1fr; }
      .grid .span-2 { grid-column: 1 / -1; }
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 18px;
    }
    .stat-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 4px; }
    @media (min-width: 480px) {
      .stat-row { grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); }
    }
    .stat {
      background: var(--accent-soft);
      border-radius: 10px;
      padding: 10px 12px;
      text-align: center;
    }
    .stat .value { font-size: 1.3rem; font-weight: 700; display: block; line-height: 1.2; }
    .stat .label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
    .nav-links { font-size: 0.9rem; margin: 10px 0 4px; }
    .nav-links a { color: var(--accent); text-decoration: none; margin-right: 14px; }

    /* Calendar */
    .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .cal-header a { color: var(--accent); text-decoration: none; font-weight: 600; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal-dow { font-size: 0.68rem; color: var(--muted); text-align: center; padding-bottom: 4px; text-transform: uppercase; }
    .cal-cell {
      display: block;
      border-radius: 8px;
      min-height: 60px;
      padding: 4px;
      font-size: 0.68rem;
      line-height: 1.3;
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--border);
    }
    @media (min-width: 760px) { .cal-cell { min-height: 82px; font-size: 0.7rem; } }
    .cal-cell.empty { border: none; background: transparent; }
    .cal-day-num { font-weight: 700; font-size: 0.8rem; }
    .cal-today { outline: 2px solid var(--accent); outline-offset: -1px; }
    .cal-extra { display: none; }
    @media (min-width: 760px) { .cal-extra { display: block; } }
  </style>
</head>
<body class="{% block body_class %}{% endblock %}">
  {% for category, message in get_flashed_messages(with_categories=true) %}
    <div class="flash {{ category }}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</body>
</html>
