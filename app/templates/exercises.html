{% extends "base.html" %}
{% block title %}Exercises{% endblock %}
{% block body_class %}wide{% endblock %}
{% block content %}
  <h1>Workout history</h1>
  {% if names %}
    <ul class="entries">
      {% for n in names %}
        <li>
          <div class="entry-main">{{ n }}</div>
          <a class="edit-link" href="{{ url_for('exercise_detail', name=n) }}">View</a>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="hint">No workouts logged yet.</p>
  {% endif %}
  <form method="get" action="{{ url_for('index') }}">
    <button type="submit" class="secondary">Back</button>
  </form>
{% endblock %}
