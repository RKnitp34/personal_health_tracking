services:
  - type: web
    name: health-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn run:app
    envVars:
      - key: DATABASE_URL
        sync: false # set manually in the Render dashboard -- your Neon connection string
      - key: SECRET_KEY
        sync: false # set manually in the Render dashboard -- a random value, not the dev default
      - key: PYTHON_VERSION
        value: "3.12"
