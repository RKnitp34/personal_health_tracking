{% extends "base.html" %}
{% block title %}Edit workout{% endblock %}
{% block content %}
  <h1>Edit workout</h1>
  <form method="post" action="{{ url_for('edit_entry', entry_type='workout', entry_id=workout.id) }}">
    <label>Date</label>
    <input type="date" name="date" value="{{ workout.date }}" required>
    <label>Exercise name</label>
    <input type="text" name="name" value="{{ workout.name }}" required>
    <button type="submit">Save</button>
  </form>

  <h2>Sets</h2>
  {% for s in workout.exercise_sets %}
    <form method="post" action="{{ url_for('update_set', set_id=s.id) }}" class="row">
      <input type="number" step="0.5" name="weight_kg" value="{{ s.weight_kg if s.weight_kg is not none else '' }}" placeholder="kg">
      <input type="number" step="1" name="reps" value="{{ s.reps }}" placeholder="reps" required>
      <button type="submit" style="flex: 0 0 auto; width: auto;">Save</button>
    </form>
    <form method="post" action="{{ url_for('delete_set', set_id=s.id) }}"
          onsubmit="return confirm('Delete this set?')">
      <button type="submit" class="danger">Delete set</button>
    </form>
  {% else %}
    <p class="hint">No sets recorded.</p>
  {% endfor %}

  <form method="post" action="{{ url_for('delete_entry', entry_type='workout', entry_id=workout.id) }}"
        onsubmit="return confirm('Delete the whole workout?')">
    <button type="submit" class="danger">Delete whole workout</button>
  </form>
  <form method="get" action="{{ url_for('index') }}">
    <button type="submit" class="secondary">Back</button>
  </form>
{% endblock %}
